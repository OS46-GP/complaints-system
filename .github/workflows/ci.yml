name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: 22
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/complaints_test

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18
        env:
          POSTGRES_DB: complaints_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Apply Prisma migrations
        working-directory: packages/db
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed database
        working-directory: packages/db
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Typecheck
        run: npm run typecheck

      - name: Build API
        run: npm run build -w apps/api

      - name: Start API server
        run: |
          node apps/api/dist/main &
          echo "Waiting for API to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/auth/login > /dev/null 2>&1; then
              echo "API is ready"
              break
            fi
            sleep 2
          done
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          PORT: 3000

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno API tests
        working-directory: apps/api/bruno
        run: bru run . --env CI
