# Single-origin layout: nginx serves the built SPA at / and proxies /api and
# /uploads to the API container, so no CORS configuration is needed (the API
# only whitelists localhost:5173, which is fine because browsers see one origin).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the api container name at REQUEST time, not config-load time.
    # nginx resolves `proxy_pass http://api:3000` (static) once at startup —
    # if the api container isn't resolvable on Docker DNS at that moment the
    # config fails to load and the container crash-loops. A variable defers
    # resolution via Docker's embedded DNS (127.0.0.11).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;

    # API limits uploads to 10MB (intake.module.ts) — allow headroom for multipart overhead.
    client_max_body_size 20m;

    # AI endpoints (triage / summary / report drafting) take 8-15s+ and the
    # frontend waits up to 180s — don't let nginx cut them off.
    proxy_http_version 1.1;
    proxy_read_timeout  300s;
    proxy_send_timeout  300s;
    proxy_connect_timeout 10s;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # API responses: browsers may cache but MUST revalidate with the server
        # on every use (ETag -> 304). Nest sends ETags with no Cache-Control,
        # which Firefox-family browsers (Zen, etc.) heuristically cache — even
        # 404/error responses — and replay after a server restart (surfacing as
        # "all API calls 404" in one browser while others work). `no-cache`
        # forces revalidation, so a stale entry can never be served blind.
        add_header Cache-Control "private, no-cache" always;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed assets — cache them aggressively.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback (same behavior as apps/web/vercel.json rewrites).
    location / {
        try_files $uri /index.html;
    }
}