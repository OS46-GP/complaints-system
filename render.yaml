services:
  - type: web
    name: complaints-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./deploy/Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: complaints-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Add via Render Dashboard → complaints-api → Environment:
      # SBG_API_KEY or OPENAI_API_KEY, LLM_MODEL, EMBEDDING_MODEL, FB_ACCESS_TOKEN
    disks:
      - name: uploads
        mountPath: /app/apps/api/uploads
        sizeGB: 1 # requires Starter plan ($7/mo) — free has no disk, uploads ephemeral otherwise

  - type: web
    name: complaints-web
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./deploy/Dockerfile.web
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        value: https://complaints-api-nkkw.onrender.com # cross-origin on Render (CORS allows complaints-web.onrender.com + CORS_ORIGIN)

databases:
  - name: complaints-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
